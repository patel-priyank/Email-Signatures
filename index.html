<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Sign Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="container loading">
      <h1 class="title">Email Sign Generator</h1>

      <article class="email" aria-live="polite">
        <div class="body" aria-hidden="true"></div>
        <p class="signature"></p>
        <p class="name" contenteditable="plaintext-only" spellcheck="false" title="Click to edit your name"></p>
      </article>

      <nav class="keys">
        <button class="key copy" data-shortcut="c" aria-label="Copy signature (C)">
          <span class="top">
            <i class="ph ph-copy"></i>
            <kbd>C</kbd>
          </span>
          <span class="label">copy</span>
        </button>

        <button class="key new" data-shortcut="n" aria-label="New signature (N)">
          <span class="top">
            <i class="ph ph-arrows-clockwise"></i>
            <kbd>N</kbd>
          </span>
          <span class="label">new</span>
        </button>

        <a
          class="key source"
          data-shortcut="s"
          href="https://github.com/patel-priyank/Email-Signatures"
          target="_blank"
          rel="noopener"
          aria-label="Source code (S)"
        >
          <span class="top">
            <i class="ph ph-code"></i>
            <kbd>S</kbd>
          </span>
          <span class="label">source</span>
        </a>
      </nav>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
